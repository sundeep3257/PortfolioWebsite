# Render Blueprint — Static Site for the Vite SPA portfolio.
# Creating via Dashboard? Use the same values documented in the deploy notes;
# this file is optional Infrastructure-as-Code if you deploy with Blueprints.
services:
  - type: web
    name: sundeep-chakladar-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Existing files (prerendered /projects/:slug/index.html, assets, PDFs)
      # are served first; this catch-all covers client-side History API routes.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
